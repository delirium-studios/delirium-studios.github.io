<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tienda · Delirium Studios</title>
<link rel="icon" type="image/png" href="icono-192.png">
<meta name="description" content="Merch oficial de Delirium Studios. Stay delirious.">
<meta name="theme-color" content="#0b0b0d">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://cgvwclbjmysaesfblixp.supabase.co; connect-src https://cgvwclbjmysaesfblixp.supabase.co; base-uri 'none'; form-action 'none'">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Space+Grotesk:wght@400;500;700&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0b0b0d; --s: #141418; --s2: #1c1c22; --b: #2d2d37; --t: #f4f4f6; --m: #a2a2b0; --v: #7d39eb; --vt: #bf9bff; --l: #c6ff33; }
  * { box-sizing: border-box; } body { margin: 0; background: var(--bg); color: var(--t); font: 400 16px/1.55 'Space Grotesk', system-ui, sans-serif; }
  h1, h2, h3 { font-family: Sora, sans-serif; letter-spacing: -.02em; margin: 0; }
  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 14px 20px; background: rgba(11,11,13,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--b); }
  header b { font: 800 19px Sora, system-ui, sans-serif; } header span { font: 12px 'Space Mono', monospace; color: var(--l); letter-spacing: .12em; }
  .cart-btn { margin-left: auto; border: 0; border-radius: 999px; padding: 10px 16px; background: var(--l); color: #0b0b0d; font: 700 15px 'Space Grotesk', system-ui, sans-serif; cursor: pointer; }
  .hero { padding: 42px 20px 26px; text-align: center; background: radial-gradient(circle at 50% 0, rgba(125,57,235,.35), transparent 60%); }
  .hero h1 { font-size: clamp(30px, 6vw, 52px); } .hero p { color: var(--m); max-width: 560px; margin: 10px auto 0; }
  main { max-width: 1120px; margin: 0 auto; padding: 0 20px 80px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
  .p { background: var(--s); border: 1px solid var(--b); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
  .p .img { aspect-ratio: 1; background: var(--s2) center/cover no-repeat; display: grid; place-items: center; color: var(--m); font: 12px 'Space Mono', monospace; }
  .p .in { padding: 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; } .p .cat { font: 11px 'Space Mono', monospace; letter-spacing: .1em; text-transform: uppercase; color: var(--vt); }
  .p .pr { font: 800 20px Sora, system-ui, sans-serif; } .p .q { font-size: 13px; color: var(--l); } .p .d { font-size: 14px; color: var(--m); flex: 1; }
  .btn { border: 1px solid var(--b); background: var(--s2); color: var(--t); border-radius: 10px; padding: 11px 14px; font: 500 15px 'Space Grotesk', system-ui, sans-serif; cursor: pointer; }
  .btn.v { background: var(--v); border-color: var(--v); color: #fff; } .btn.l { background: var(--l); color: #0b0b0d; border-color: var(--l); font-weight: 700; }
  .btn:disabled { opacity: .5; cursor: not-allowed; } :focus-visible { outline: 3px solid var(--l); outline-offset: 2px; }
  .panel { position: fixed; inset: 0 0 0 auto; width: min(440px, 100%); background: var(--s); border-left: 1px solid var(--b); transform: translateX(100%); transition: transform .2s; z-index: 10; display: flex; flex-direction: column; }
  .panel.open { transform: none; } .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 9; display: none; } .scrim.open { display: block; }
  .panel .hd { padding: 18px 20px; border-bottom: 1px solid var(--b); display: flex; align-items: center; } .panel .bd { padding: 16px 20px; overflow: auto; flex: 1; } .panel .ft { padding: 16px 20px; border-top: 1px solid var(--b); }
  .x { margin-left: auto; background: none; border: 0; color: var(--m); font-size: 22px; cursor: pointer; }
  .li { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--b); } .li .n { flex: 1; } .li input { width: 62px; }
  label { display: block; font-size: 14px; color: var(--m); margin: 12px 0 4px; } input, select, textarea { width: 100%; background: var(--bg); color: var(--t); border: 1px solid var(--b); border-radius: 10px; padding: 10px 12px; font: inherit; }
  .tot { display: flex; justify-content: space-between; font: 800 20px Sora, system-ui, sans-serif; margin: 8px 0 12px; } .note { background: rgba(125,57,235,.16); border-radius: 10px; padding: 12px 14px; font-size: 14px; white-space: pre-wrap; margin-top: 12px; }
  .ok { text-align: center; padding: 30px 10px; } .ok b { font: 800 26px Sora, system-ui, sans-serif; color: var(--l); display: block; }
  footer { text-align: center; color: var(--m); font: 12px 'Space Mono', monospace; letter-spacing: .1em; padding: 30px 20px; border-top: 1px solid var(--b); }
  .empty { text-align: center; color: var(--m); padding: 60px 20px; } .hp { position: absolute; left: -9999px; }
</style>
</head>
<body>
<header><div><b id="t">Delirium Merch</b><br><span>STAY DELIRIOUS</span></div><button class="cart-btn" id="cartBtn" aria-label="Ver carrito">Carrito · 0</button></header>
<section class="hero"><h1 id="h1">Merch de Delirium</h1><p id="sub">Ediciones limitadas. Pagas por Pago Móvil, Zelle o el método que prefieras y te confirmamos por WhatsApp.</p></section>
<main><div class="grid" id="grid"><p class="empty">Cargando productos…</p></div></main>
<footer id="foot">DELIRIUM STUDIOS · FOLLOW THE GLOW</footer>
<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel" aria-label="Carrito" role="dialog"><div class="hd"><h2>Tu pedido</h2><button class="x" id="cerrar" aria-label="Cerrar">✕</button></div><div class="bd" id="bd"></div><div class="ft" id="ft"></div></aside>
<script>
const API = 'https://cgvwclbjmysaesfblixp.supabase.co/functions/v1/delirium/tienda'; const KEY = 'sb_publishable_swNHK_lU-SlE6FNeGyFYqg_Ttu3DGDG';
let cat = null; const carrito = {}; try { Object.assign(carrito, JSON.parse(localStorage.getItem('delirium-carrito') || '{}')); } catch (e) {}
const $ = (s) => document.querySelector(s); const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (n) => `${cat.simbolo || '$'}${Number(n || 0).toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
const guardar = () => { try { localStorage.setItem('delirium-carrito', JSON.stringify(carrito)); } catch (e) {} pintarBoton(); };
const api = async (b) => { const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: KEY }, body: JSON.stringify(b) }); return r.json(); };
const pintarBoton = () => { const n = Object.values(carrito).reduce((a, b) => a + b, 0); $('#cartBtn').textContent = `Carrito · ${n}`; };
async function cargar() {
  try { cat = await api({ accion: 'catalogo' }); } catch (e) { $('#grid').innerHTML = '<p class="empty">No pudimos cargar la tienda. Intenta en un momento.</p>'; return; }
  if (!cat.activa) { $('#grid').innerHTML = '<p class="empty">La tienda está cerrada por ahora. ¡Vuelve pronto!</p>'; return; }
  document.title = `${cat.titulo} · ${cat.empresa || 'Delirium Studios'}`; $('#t').textContent = cat.titulo; $('#h1').textContent = cat.titulo;
  if (cat.envios) $('#sub').textContent = cat.envios; if (cat.redes) $('#foot').textContent = `${(cat.empresa || 'DELIRIUM STUDIOS').toUpperCase()} · ${cat.redes} · FOLLOW THE GLOW`;
  for (const id of Object.keys(carrito)) if (!cat.productos.some(p => p.id === id)) delete carrito[id];
  $('#grid').innerHTML = cat.productos.length ? cat.productos.map(p => `<article class="p"><div class="img" style="${p.imagen ? `background-image:url('${esc(p.imagen)}')` : ''}" role="img" aria-label="${esc(p.nombre)}">${p.imagen ? '' : 'DELIRIUM'}</div>
    <div class="in"><span class="cat">${esc(p.categoria)}</span><h3>${esc(p.nombre)}</h3><span class="pr">${money(p.precio)}</span>${p.disponibles <= 5 ? `<span class="q">¡Quedan ${p.disponibles}!</span>` : ''}${p.descripcion ? `<span class="d">${esc(p.descripcion)}</span>` : '<span class="d"></span>'}
    <button class="btn l" data-add="${p.id}">Agregar</button></div></article>`).join('') : '<p class="empty">Pronto habrá nuevos drops.</p>';
  document.querySelectorAll('[data-add]').forEach(b => b.onclick = () => { const p = cat.productos.find(x => x.id === b.dataset.add); carrito[p.id] = Math.min(p.disponibles, (carrito[p.id] || 0) + 1); guardar(); b.textContent = '✓ Agregado'; setTimeout(() => b.textContent = 'Agregar', 1200); });
  pintarBoton();
}
function abrir() { $('#panel').classList.add('open'); $('#scrim').classList.add('open'); pintarCarrito(); }
function cerrar() { $('#panel').classList.remove('open'); $('#scrim').classList.remove('open'); }
function pintarCarrito() {
  const items = Object.entries(carrito).map(([id, q]) => ({ p: cat.productos.find(x => x.id === id), q })).filter(x => x.p);
  if (!items.length) { $('#bd').innerHTML = '<p class="empty">Tu carrito está vacío.</p>'; $('#ft').innerHTML = ''; return; }
  const total = items.reduce((a, x) => a + x.p.precio * x.q, 0);
  $('#bd').innerHTML = `${items.map(x => `<div class="li"><div class="n"><b>${esc(x.p.nombre)}</b><br><span style="color:var(--m)">${money(x.p.precio)}</span></div><input type="number" min="0" max="${x.p.disponibles}" value="${x.q}" data-q="${x.p.id}" aria-label="Cantidad"></div>`).join('')}
    <div class="tot" style="margin-top:14px"><span>Total</span><span>${money(total)}</span></div>
    <form id="f"><label for="n">Nombre *</label><input id="n" name="comprador" required autocomplete="name"><label for="c">WhatsApp o teléfono *</label><input id="c" name="contacto" required autocomplete="tel">
      <label for="e">Correo (opcional)</label><input id="e" name="email" type="email" autocomplete="email"><label for="en">Entrega o dirección</label><input id="en" name="entrega" placeholder="Retiro, delivery o envío (ciudad)">
      <label for="m">¿Cómo vas a pagar?</label><select id="m" name="metodo">${cat.metodos.map(x => `<option>${esc(x)}</option>`).join('')}</select>
      ${cat.datos_pago ? `<div class="note"><b>Datos de pago</b>\n${esc(cat.datos_pago)}</div>` : ''}
      <label for="r">Referencia del pago (si ya pagaste)</label><input id="r" name="referencia"><label for="no">Nota</label><textarea id="no" name="nota" rows="2"></textarea><input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true"></form>`;
  $('#ft').innerHTML = '<button class="btn v" style="width:100%" id="enviar">Hacer pedido</button><p style="font-size:13px;color:var(--m);margin:8px 0 0">Te confirmamos el pago y la entrega por WhatsApp.</p>';
  document.querySelectorAll('[data-q]').forEach(i => i.onchange = () => { const v = Math.max(0, Math.min(Number(i.max), Number(i.value) || 0)); if (v) carrito[i.dataset.q] = v; else delete carrito[i.dataset.q]; guardar(); pintarCarrito(); });
  $('#enviar').onclick = async (e) => {
    const f = $('#f'); if (!f.reportValidity()) return; e.target.disabled = true; e.target.textContent = 'Enviando…';
    const datos = Object.fromEntries(new FormData(f)); datos.accion = 'pedido'; datos.lineas = Object.entries(carrito).map(([product_id, cantidad]) => ({ product_id, cantidad }));
    let r; try { r = await api(datos); } catch (x) { r = { error: 'Sin conexión. Intenta de nuevo.' }; }
    if (r.error) { alert(r.error); e.target.disabled = false; e.target.textContent = 'Hacer pedido'; return; }
    for (const k of Object.keys(carrito)) delete carrito[k]; guardar();
    $('#bd').innerHTML = `<div class="ok"><b>¡Pedido recibido!</b><p>Tu número de pedido es <b style="font-size:20px;display:inline;color:var(--t)">${esc(r.codigo)}</b> por ${money(r.total)}.</p>${r.datos_pago ? `<div class="note" style="text-align:left"><b>Para pagar</b>\n${esc(r.datos_pago)}</div>` : ''}<p style="color:var(--m)">Te escribiremos para confirmar. Stay delirious ✦</p></div>`; $('#ft').innerHTML = '';
  };
}
$('#cartBtn').onclick = abrir; $('#cerrar').onclick = cerrar; $('#scrim').onclick = cerrar; addEventListener('keydown', (e) => { if (e.key === 'Escape') cerrar(); });
cargar();
</script>
</body>
</html>
